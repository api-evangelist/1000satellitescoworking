description: >-
  1000 Satellites runs two overlapping projections of one WordPress data core: a remote MCP server and the
  anonymously readable wp/v2 REST content surface. This crosswalk exists to record that divergence rather
  than paper over it. It is deliberately EMPTY on the tool side: the MCP tools/list call is
  authentication-gated (HTTP 401) on both server routes, and the WordPress Abilities registry that backs
  the tools is gated too, so no tool name is known. No tool rows are guessed from the REST surface —
  inventing plausible names for an unenumerated server is the failure mode this artifact is meant to
  prevent.
