apis:
- aid: 1000satellitescoworking:mcp
  name: 1000 Satellites MCP Server (WordPress MCP Adapter)
  description: >-
    A remote Model Context Protocol server served from the 1000satellites.de WordPress estate under the
    "mcp" REST namespace. Two MCP routes are advertised in the route index — mcp-oauth-server and
    mcp-adapter-default-server — and the apex domain publishes both RFC 8414 OAuth authorization-server
    metadata and RFC 9728 protected-resource metadata naming mcp-oauth-server as the protected resource.
    Authorization is OAuth 2.1 authorization-code with PKCE (S256), a single `mcp` scope, public clients
    (token_endpoint_auth_method none) and client-ID metadata documents. The live tool set could not be
    enumerated: an anonymous JSON-RPC initialize and tools/list both return HTTP 401 (mcp_unauthorized on
    the OAuth server, rest_forbidden on the default adapter server), as does the companion
    wp-abilities/v1 abilities registry that backs the tools.
  humanURL: https://1000satellites.de/wp-json/mcp
  baseURL: https://1000satellites.de/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  properties:
  - type: MCPServer
    url: mcp/1000satellitescoworking-mcp.yml
  - type: ToolCrosswalk
    url: mcp/1000satellitescoworking-tool-crosswalk.yml
  - type: OAuthScopes
    url: scopes/1000satellitescoworking-scopes.yml
  - type: Authentication
    url: authentication/1000satellitescoworking-authentication.yml
  x-evidence:
    protected_resource: https://1000satellites.de/.well-known/oauth-protected-resource
    authorization_server: https://1000satellites.de/.well-known/oauth-authorization-server
    http_status: 200
    tools_list_status: 401
    fetched: '2026-09-05'
- aid: 1000satellitescoworking:content-api
  name: 1000 Satellites Content API (WordPress REST wp/v2)
  description: >-
    The anonymously readable WordPress REST content surface of 1000satellites.de. Ten resources returned
    HTTP 200 to an unauthenticated request on 2026-09-05 — posts, pages, media, categories, tags, comments,
    types, taxonomies, statuses and site search — covering the company news feed, its location and
    marketing pages and its media library, in both German and English (the site runs WPML). This is the
    CMS content API, not a product API: 1000 Satellites publishes no OpenAPI of its own, and the OpenAPI
    linked here was derived mechanically from the route-discovery document at /wp-json/. Write operations
    exist on these routes but require WordPress authentication and are not documented.
  humanURL: https://1000satellites.de/en/news/
  baseURL: https://1000satellites.de/wp-json
  tags:
  - Content
  - News
  - Media
  - Search
