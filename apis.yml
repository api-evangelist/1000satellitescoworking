aid: 1000satellitescoworking
name: 1000 Satellites
description: >-
  1000 Satellites GmbH is a German flex-office and coworking operator founded in 2019 in Mannheim by Caro
  Windlin, Markus Hummelsberger and Gregory von Abendroth as a spin-off of BASF's innovation unit Chemovator.
  It converts underused office space from corporate real-estate portfolios into professionally operated,
  decentralised "satellite" workspaces across the Rhein-Neckar region, Munich, Hamburg and Berlin, selling
  day passes, monthly memberships, team tickets, fixed desks, meeting rooms and event space rather than a
  software product. It is not a software vendor and publishes no product or developer API. Its machine-readable
  surface is what the company's WordPress estate exposes on 1000satellites.de: an anonymously readable
  WordPress REST content API (wp/v2) serving news posts, location and marketing pages, media and site search;
  and — notably for a business of this kind — a live remote Model Context Protocol server published through
  the WordPress MCP Adapter, advertised by real RFC 8414 OAuth authorization-server metadata and RFC 9728
  protected-resource metadata, with tools/list authentication-gated.
