        schema:
          type: string
        description: Eine alphanumerische Kennung für den Status.
      - name: context
        in: query
        required: false
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
        description: Geltungsbereich, unter dem die Anfrage erfolgt; bestimmt die in der Antwort vorhandenen Felder.
      - name: wpml_language
        in: query
        required: false
        schema:
          type: string
          enum:
