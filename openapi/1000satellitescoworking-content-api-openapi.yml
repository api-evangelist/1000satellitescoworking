          type: string
          enum:
          - en
          - de
        description: WPML's language code
      responses:
        '200':
          description: The requested post.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/WPError'
        '404':
          $ref: '#/components/responses/WPError'
