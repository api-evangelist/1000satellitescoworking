openapi: 3.1.0
info:
  title: 1000 Satellites Content API (WordPress REST wp/v2)
  version: wp/v2
  summary: 'Public read surface of 1000satellites.de: news posts, location and marketing pages, media library, taxonomies
    and site search.'
  description: '1000 Satellites publishes 1000satellites.de on WordPress, which exposes the WordPress REST API at https://1000satellites.de/wp-json/.
    The wp/v2 namespace is anonymously readable and returns the company''s news posts, location and marketing pages, media
    library, categories, tags, comments, registered types/taxonomies/statuses and a site-wide search endpoint as JSON.


    This document was DERIVED mechanically by API Evangelist from the route-discovery document served at https://1000satellites.de/wp-json/
    on 2026-09-05 — every path, method and parameter below is taken verbatim from that descriptor, and only the resources
    that were confirmed to return HTTP 200 to an anonymous request on that date are included. 1000 Satellites does not publish
    an OpenAPI definition of its own, and this is not a product API: it is the content API the CMS exposes. Write operations
    exist on several of these routes but require authentication (WordPress Application Passwords over HTTP Basic) and are
    deliberately not documented here. The /wp/v2/users, /wp/v2/settings, /wp/v2/themes, /wp/v2/plugins, /wp/v2/menus and /wp/v2/block-types
    routes returned HTTP 401 to an anonymous request and are likewise excluded.'
  contact:
    name: 1000 Satellites GmbH
    url: https://1000satellites.de/kontakt/
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://1000satellites.de/wp-json/
  x-derived-on: '2026-09-05'
  x-provider-published: false
servers:
- url: https://1000satellites.de/wp-json
  description: Production
tags:
- name: Posts
  description: Blog posts and news articles published on 1000satellites.de.
- name: Pages
  description: Marketing, location and legal pages of the 1000 Satellites site.
- name: Media
  description: Media library items (photography of the coworking locations, documents).
- name: Categories
  description: Post categories.
- name: Tags
  description: Post tags.
- name: Comments
  description: Comments on posts.
- name: Types
  description: Registered post types on the site.
- name: Taxonomies
  description: Registered taxonomies on the site.
- name: Statuses
  description: Registered post statuses.
- name: Search
  description: Site-wide search across public content.
paths:
  /wp/v2/posts:
    get:
      operationId: listPosts
      summary: List posts
      description: Blog posts and news articles published on 1000satellites.de.
      tags:
      - Posts
      parameters:
      - name: context
        in: query
        required: false
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
        description: Geltungsbereich, unter dem die Anfrage erfolgt; bestimmt die in der Antwort vorhandenen Felder.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Aktuelle Seite der Sammlung.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        description: Maximale Anzahl der im Ergebnissatz zurückzugebenden Elemente.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Ergebnisse auf alle begrenzen, die mit einer Zeichenfolge übereinstimmen.
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Antwort auf Beiträge einschränken, die nach einem bestimmten ISO8601-konformen Datum veröffentlicht wurden.
      - name: modified_after
        in: query
        required: false
        schema:
          type: string
        description: Antwort auf Beiträge einschränken, die nach einem bestimmten ISO8601-konformen Datum geändert wurden.
      - name: author
        in: query
        required: false
        schema:
          type: array
          default: []
          items:
            type: integer
        description: Ergebnissatz auf Beiträge begrenzen, die bestimmten Autoren zugewiesen sind.
      - name: author_exclude
        in: query
        required: false
        schema:
          type: array
          default: []
          items:
            type: integer
        description: Sicherstellen, dass der Ergebnissatz Beiträge ausschließt, die bestimmten Autoren zugewiesen sind.
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: Antwort auf Beiträge einschränken, die vor einem bestimmten ISO8601-konformen Datum veröffentlicht wurden.
      - name: modified_before
        in: query
        required: false
        schema:
          type: string
        description: Antwort auf Beiträge einschränken, die vor einem bestimmten ISO8601-konformen Datum geändert wurden.
      - name: exclude
        in: query
        required: false
        schema:
          type: array
          default: []
          items:
            type: integer
        description: Stelle sicher, dass der Ergebnissatz bestimmte IDs ausschließt.
      - name: include
        in: query
        required: false
        schema:
          type: array
          default: []
          items:
            type: integer
        description: Ergebnissatz auf bestimmte IDs begrenzen.
      - name: search_semantics
        in: query
        required: false
        schema:
          type: string
          enum:
          - exact
        description: Wie man Suchbegriffe interpretiert.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Den Ergebnissatz um eine bestimmte Anzahl von Elementen verschieben.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Das Sortierattribut aufsteigend oder absteigend sortieren.
      - name: orderby
        in: query
        required: false
        schema:
          type: string
          enum:
          - author
          - date
          - id
          - include
          - modified
          - parent
          - relevance
          - slug
          - include_slugs
          - title
          default: date
        description: Sammlung nach Beitragsattribut sortieren.
      - name: search_columns
        in: query
        required: false
        schema:
          type: array
          default: []
          items:
            type: string
            enum:
            - post_title
            - post_content
            - post_excerpt
        description: Array mit den zu durchsuchenden Spaltennamen.
      - name: slug
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Ergebnissatz auf Beiträge mit einer oder mehreren bestimmten Titelformen begrenzen.
      - name: status
        in: query
        required: false
        schema:
          type: array
          default: publish
          items:
            type: string
            enum:
            - publish
            - future
            - draft
            - pending
            - private
            - trash
            - auto-draft
            - inherit
            - request-pending
            - request-confirmed
            - request-failed
            - request-completed
            - any
        description: Ergebnissatz auf Beiträge begrenzen, denen ein oder mehrere Status zugewiesen sind.
      - name: tax_relation
        in: query
        required: false
        schema:
          type: string
          enum:
          - AND
          - OR
        description: Abfrage-Ergebnis auf Basis der Beziehung zwischen mehreren Taxonomien einschränken.
      - name: categories
        in: query
        required: false
        schema:
          type: object
        description: Ergebnissatz auf Elemente beschränken, denen bestimmte Begriffe in der Taxonomie categories zugewiesen
          sind.
      - name: categories_exclude
        in: query
        required: false
        schema:
          type: object
        description: Ergebnissatz auf Elemente beschränken, außer auf solche, denen bestimmte Begriffe in der Taxonomie categories
          zugewiesen sind.
      - name: tags
        in: query
        required: false
        schema:
          type: object
        description: Ergebnissatz auf Elemente beschränken, denen bestimmte Begriffe in der Taxonomie tags zugewiesen sind.
      - name: tags_exclude
        in: query
        required: false
        schema:
          type: object
        description: Ergebnissatz auf Elemente beschränken, außer auf solche, denen bestimmte Begriffe in der Taxonomie tags
          zugewiesen sind.
      - name: sticky
        in: query
        required: false
        schema:
          type: boolean
        description: Den Ergebnissatz auf Elemente begrenzen, die oben gehalten werden.
      - name: ignore_sticky
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Ob oben gehaltene Beiträge ignoriert werden sollen oder nicht.
      - name: format
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - standard
            - aside
            - chat
            - gallery
            - link
            - image
            - quote
            - status
            - video
            - audio
        description: Den Ergebnissatz auf Elemente begrenzen, denen ein oder mehrere bestimmte Formate zugeordnet sind.
      - name: wpml_language
        in: query
        required: false
        schema:
          type: string
          enum:
          - en
          - de
        description: WPML's language code
      responses:
        '200':
          description: A page of posts. Total count is returned in the X-WP-Total header and page count in X-WP-TotalPages.
          headers:
            X-WP-Total:
              description: Total number of items in the collection.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/WPError'
        '401':
          $ref: '#/components/responses/WPError'
        '404':
          $ref: '#/components/responses/WPError'
  /wp/v2/posts/{id}:
    get:
      operationId: getPost
      summary: Get a single post
      description: Retrieve one item from the posts collection by its unique identifier.
      tags:
      - Posts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Eindeutige Kennung für den Beitrag.
      - name: context
