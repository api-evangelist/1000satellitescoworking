absent_domain_entities:
  note: >-
    Recorded so the gap is legible rather than silent. A consumer integrating with a coworking operator
    would expect Location, Space, Desk, MeetingRoom, Availability, Booking, Member and Invoice. None is
    exposed. Location data exists inside the Listdom plugin (listdom-listing post type, with category,
    location, tag and label taxonomies visible in the sitemap) but is not registered in wp/v2 —
    /wp/v2/listdom-listing returns rest_no_route — and the plugin's own public feed at
    /wp-json/listdom/v1/public/listings returns HTTP 403 "The public listings feed is unavailable."
    Enabling that feed would be the single cheapest change this company could make to become
    machine-readable about its actual product.
  expected: [Location, Space, Desk, MeetingRoom, Availability, Booking, Membership, Member, Invoice]
